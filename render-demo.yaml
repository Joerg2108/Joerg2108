# Render Blueprint – öffentliche DEMO des Back Office für Interessenten
# Anleitung: backoffice/docs/DEMO.md
#
# Läuft im kostenlosen Free-Tarif ohne Disk: Datenverlust ist hier gewollt.
# Bei jedem Start und alle DEMO_RESET_HOURS Stunden werden die Musterdaten neu angelegt.
# Die echte Installation (render.yaml) bleibt davon völlig unberührt.
services:
  - type: web
    name: backoffice-demo
    runtime: node
    rootDir: backoffice
    region: frankfurt
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node --no-warnings src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "1"
      - key: DEMO_RESET_HOURS
        value: "6"
      # Ziel des Buttons „Für Ihr Unternehmen anfragen“ und Anbietername im Demo-Banner
      - key: DEMO_CONTACT_URL
        value: https://joerg-noack.com/kontakt
      - key: DEMO_VENDOR
        value: Jörg Noack
