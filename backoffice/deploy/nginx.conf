# Nginx als Reverse Proxy (Zertifikat z. B. per certbot --nginx)
server {
    listen 443 ssl http2;
    server_name office.joerg-noack.com;

    ssl_certificate     /etc/letsencrypt/live/office.joerg-noack.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office.joerg-noack.com/privkey.pem;

    client_max_body_size 25m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
server {
    listen 80;
    server_name office.joerg-noack.com;
    return 301 https://$host$request_uri;
}
